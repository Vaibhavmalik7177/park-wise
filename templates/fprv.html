{% extends "layout_visitor.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="alert alert-warning text-center py-2 mb-3 mx-auto" role="alert" style="max-width: 400px; font-size: 0.85rem;">
        <strong>⚠️ Note:</strong> Inputs are <strong>case-sensitive</strong>.
    </div>
    <form action="/fprv" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Name" type="text">
        </div>

        <div class ="mb-3">
            <input class="form-control mx-auto w-auto" name="phno" placeholder="Phone Number" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Continue</button>
    </form>
{% endblock %}
