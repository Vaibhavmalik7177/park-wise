{% extends "layout_visitor.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="alert alert-warning text-center py-2 mb-3 mx-auto" role="alert" style="max-width: 400px; font-size: 0.85rem;">
        <strong>⚠️ Note:</strong> Inputs are <strong>case-sensitive</strong>.
    </div>
    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Name" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Registraion Number(Vehicle)" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="cp" placeholder="confirmation" type="password">
        </div>
        <div class ="mb-3">
            <input class="form-control mx-auto w-auto" name="phno" placeholder="Phone Number" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
{% endblock %}
