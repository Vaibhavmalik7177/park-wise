{% extends "layout_visitor.html" %}

{% block title %}
    Update_Password_Forum
{% endblock %}

{% block main %}
    <form action="/upf" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="Password" placeholder="New password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="cp" placeholder="Re-enter new Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Change Password</button>
    </form>
{% endblock %}
